services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: officeorg
      POSTGRES_PASSWORD: officeorg
      POSTGRES_DB: officeorg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U officeorg"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
